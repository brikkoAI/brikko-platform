# /etc/wireguard/wg0.conf на Hetzner CX22 (Helsinki).
# Server-side WireGuard. Selectel подключается как peer.
#
# Настройка:
#   1. wg genkey | tee /etc/wireguard/privatekey | wg pubkey > /etc/wireguard/publickey
#   2. chmod 600 /etc/wireguard/privatekey
#   3. Заменить PrivateKey на содержимое /etc/wireguard/privatekey
#   4. Заменить <SELECTEL_PUBLIC_KEY> на pubkey, который сгенерил Selectel-сервер
#   5. systemctl enable --now wg-quick@wg0
#   6. wg show — должен появиться peer
#
# См. infra/wireguard_setup.md.

[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <HETZNER_PRIVATE_KEY>
# IP forwarding + NAT для исходящих в интернет (Caddy → OpenAI/Anthropic/Google)
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
SaveConfig = false

# Peer = Selectel client (Москва)
[Peer]
PublicKey = <SELECTEL_PUBLIC_KEY>
AllowedIPs = 10.10.0.2/32
PersistentKeepalive = 25
