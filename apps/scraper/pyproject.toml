[project]
name = "brikko-scraper"
version = "0.1.0"
description = "Playwright scraper service for upstream LLM provider balances (Brikko Phase 2)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    "fastapi>=0.119,<1.0",
    "starlette>=0.49.1,<0.50",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "playwright>=1.49,<2.0",
    "structlog>=24.4,<25.0",
    # Fernet — same crypto used by gateway. Cookies arrive already-encrypted
    # but we decrypt locally just before injecting into Playwright context.
    "cryptography>=46.0.5,<47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<1.0",
    "respx>=0.21,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests can be loose on broad raises + parametrize style.
"tests/**/*.py" = ["B017", "PT011", "PT018", "PT006", "PT019", "RUF059"]
