name: Smoke after deploy

# Триггер: автоматически после успешного `deploy` job в `deploy.yml`.
# Также можно дёрнуть руками через workflow_dispatch.
#
# Цель: за <60s найти deal-breaker'ы — wget vs curl, NEXT_PUBLIC ушёл в моки,
# prerender валится, dual-auth не пашет, миграции не докатились. Если хоть
# один шаг fail — exit non-zero, что blocking-сигнал G-потоку (deploy.yml)
# для rollback'а.
#
# В smoke'е НЕ проверяем business-logic корректность (это unit/integration
# тесты в ci.yml). Только "сервис жив, контракты не сломаны".

on:
  workflow_run:
    workflows: ["Build & Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to smoke (e.g. https://api.brikko.ru или http://localhost:8000)'
        required: true
        default: 'https://api.brikko.ru'
      tag:
        description: 'Image tag of the deploy being smoked (для contextual логов)'
        required: false
        default: 'unknown'

# Один runner на запуск, не отменять старый — smoke не должен ждать.
concurrency:
  group: smoke-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  # -------- Smoke against deployed prod ------------------------------------
  smoke-prod:
    name: smoke (production)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    environment: production
    timeout-minutes: 5

    env:
      PYTHON_VERSION: "3.12"
      VOLTARI_SMOKE_BASE_URL: ${{ inputs.base_url || vars.VOLTARI_SMOKE_BASE_URL || 'https://api.brikko.ru' }}
      # БД-shortcut для verify-email через UPDATE.
      VOLTARI_SMOKE_DATABASE_URL: ${{ secrets.VOLTARI_SMOKE_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install httpx + psycopg
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest "psycopg[binary]"

      - name: Wait for service warm-up
        run: |
          echo "Waiting 30s for service to fully come up..."
          sleep 30

      - name: Verify base URL reachable
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$VOLTARI_SMOKE_BASE_URL/healthz"; then
              echo "Base URL reachable on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Base URL $VOLTARI_SMOKE_BASE_URL not reachable after 5 attempts"
          exit 1

      - name: Run smoke tests
        id: smoke
        working-directory: apps/gateway
        run: |
          pytest tests/smoke/ -v --tb=short --no-header

      - name: Notify Telegram on smoke failure
        if: failure() && steps.smoke.conclusion == 'failure'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            :red_circle: *SMOKE FAILED* on `${{ env.VOLTARI_SMOKE_BASE_URL }}`
            tag: `${{ inputs.tag || github.event.workflow_run.head_branch }}`
            commit: `${{ github.event.workflow_run.head_sha || github.sha }}`
            actor: @${{ github.actor }}

            > Production rollback должен сработать автоматически (см. deploy.yml).
            > Запусти руками если deploy.yml не отрабатывает: `gh workflow run deploy.yml --ref <prev-tag>`.

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            :white_check_mark: smoke OK on `${{ env.VOLTARI_SMOKE_BASE_URL }}`
            tag: `${{ inputs.tag || github.event.workflow_run.head_branch }}`

  # -------- Build-and-start regression -------------------------------------
  # Поднимаем полный compose-стек (postgres+redis+gateway+web) и проверяем,
  # что контейнеры health'чатся в 60s. Это ловит wget-vs-curl, NEXT_PUBLIC,
  # prerender, healthcheck mismatch — те самые баги, что нас сжигали 29.04.
  #
  # Запускается на КАЖДЫЙ push (не только после deploy), потому что
  # build-time баги ловятся ДО реального prod-deploy'а.

  compose-up-regression:
    name: docker compose up --wait
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local images
        run: |
          docker build -t voltari-gateway:local -f apps/gateway/Dockerfile apps/gateway
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/v1 \
            --build-arg NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_BRAND_NAME=Brikko \
            --build-arg NEXT_PUBLIC_AUTH_MIDDLEWARE_DISABLED=false \
            -t voltari-web:local \
            -f apps/web/Dockerfile apps/web

      - name: Create stub .env
        working-directory: infra
        run: |
          cat > .env <<EOF
          IMAGE_TAG=local
          POSTGRES_USER=voltari
          POSTGRES_PASSWORD=voltari
          POSTGRES_DB=voltari
          REDIS_PASSWORD=redis-test-only
          OPENAI_API_KEY=sk-stub-not-real
          ANTHROPIC_API_KEY=
          GOOGLE_API_KEY=
          DEEPSEEK_API_KEY=
          YANDEX_API_KEY=
          YANDEX_FOLDER_ID=
          SBER_AUTH_KEY=
          YOOKASSA_SHOP_ID=
          YOOKASSA_SECRET_KEY=
          YOOKASSA_WEBHOOK_SECRET=
          NPD_ENABLED=false
          NPD_INN=
          NPD_PASSWORD=
          AUTOREFILL_ENABLED=false
          JWT_SECRET=ci-smoke-jwt-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EMAIL_TOKEN_SECRET=ci-smoke-email-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ENCRYPTION_KEY=ci-smoke-encrypt-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_ENV=local
          BRAND_NAME=Brikko
          NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/v1
          NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
          NEXT_PUBLIC_AUTH_MIDDLEWARE_DISABLED=false
          NEXT_PUBLIC_BRAND_NAME=Brikko
          EOF

      - name: docker compose up --wait
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            up -d --wait gateway web postgres redis
        timeout-minutes: 5

      - name: docker compose ps
        if: always()
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml ps

      - name: Run alembic migrations
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            exec -T gateway alembic upgrade head

      - name: curl /healthz on gateway
        run: |
          curl -fsS --max-time 10 http://localhost:8000/healthz | tee /tmp/healthz.json
          test "$(jq -r .status < /tmp/healthz.json)" = "ok"

      - name: curl / on web
        run: |
          # Web stand-up — root page пререндерится; проверяем что 200, не 500.
          curl -fsSI --max-time 30 http://localhost:3000/ | head -1 | grep -q "200"

      - name: docker logs on failure
        if: failure()
        working-directory: infra
        run: |
          echo "=== gateway logs ==="
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs gateway --tail 200
          echo "=== web logs ==="
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs web --tail 200
          echo "=== postgres logs ==="
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs postgres --tail 50
          echo "=== redis logs ==="
          docker compose -f docker-compose.yml -f docker-compose.local.yml logs redis --tail 50

      - name: Run smoke tests against local stack
        env:
          VOLTARI_SMOKE_BASE_URL: http://localhost:8000
          VOLTARI_SMOKE_DATABASE_URL: postgresql://voltari:voltari@localhost:5432/voltari
        run: |
          pip install httpx pytest "psycopg[binary]"
          pytest apps/gateway/tests/smoke/ -v --tb=short

      - name: docker compose down
        if: always()
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
