name: Build & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.2.3 or latest)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  # См. deploy-staging.yml — namespace переехал в brikkoAI 2026-05-02.
  GATEWAY_IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE || 'brikkoai' }}/voltari-gateway
  WEB_IMAGE: ghcr.io/${{ vars.GHCR_NAMESPACE || 'brikkoai' }}/voltari-web

jobs:
  # -------- Build & push Docker images --------
  build:
    name: build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: ./apps/gateway
            dockerfile: ./apps/gateway/Dockerfile
          - service: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # NEXT_PUBLIC_* переменные запекаются в JS-bundle на build time. Без них
      # фронт стартует с ENV_BASE=undefined и переключается на MSW-моки (что
      # сломало нас в local-self-launch 29.04). Передаём их явно, ТОЛЬКО для
      # web-сервиса. Для gateway эти build-args безвредны (Dockerfile их игнорирует).
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ vars.GHCR_NAMESPACE || 'brikkoai' }}/voltari-${{ matrix.service }}:${{ steps.tag.outputs.value }}
            ghcr.io/${{ vars.GHCR_NAMESPACE || 'brikkoai' }}/voltari-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.brikko.ru/v1
            NEXT_PUBLIC_FRONTEND_URL=https://brikko.ru
            NEXT_PUBLIC_BRAND_NAME=Brikko
            NEXT_PUBLIC_AUTH_MIDDLEWARE_DISABLED=false

    outputs:
      tag: ${{ steps.tag.outputs.value }}

  # -------- Deploy to VPS --------
  deploy:
    name: deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Compute tag (same logic as build)
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # TD-024 / TD-025: SOPS decrypt — секреты из git (.env.sops.yaml), age private
      # key только в GH Actions secrets. На VPS plain `.env` живёт ровно столько,
      # сколько идёт deploy (~30s).
      #
      # SOPS_AGE_KEY — multi-line GitHub secret, содержит вывод `age-keygen`
      # (включая комментарии # public key и AGE-SECRET-KEY-1...). Записывается
      # во временный файл с chmod 600, удаляется в финальном шаге.
      - name: Install SOPS
        run: |
          SOPS_VERSION="v3.9.1"
          curl -sSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /tmp/sops
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Decrypt env from SOPS
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/sops/age
          umask 077
          printf '%s\n' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

          # Расшифровываем .env.sops.yaml → .env (dotenv-формат)
          if [ -f infra/.env.sops.yaml ]; then
            sops --decrypt --output-type dotenv infra/.env.sops.yaml > /tmp/.env.decrypted
            chmod 600 /tmp/.env.decrypted
            echo "Decrypted $(grep -cE '^[A-Z_]+=' /tmp/.env.decrypted) env vars."
          else
            echo "::error::infra/.env.sops.yaml not found in repo. Run sops -e to create it."
            exit 1
          fi

      - name: Copy decrypted .env to VPS
        # scp напрямую; SSH-action не умеет передавать файлы.
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Atomic upload: scp в .env.new → mv на VPS.
          scp -i ~/.ssh/id_deploy -P "$PROD_SSH_PORT" \
              /tmp/.env.decrypted \
              "deploy@${PROD_HOST}:/opt/voltari/.env.new"

          ssh -i ~/.ssh/id_deploy -p "$PROD_SSH_PORT" "deploy@${PROD_HOST}" "
            set -euo pipefail
            cd /opt/voltari
            # Backup previous IMAGE_TAG для rollback'а
            if [ -f .env ]; then
              grep -E '^IMAGE_TAG=' .env > .env.previous-tag || true
            fi
            # Записываем новый IMAGE_TAG в свежий .env
            sed -i 's|^IMAGE_TAG=.*|IMAGE_TAG=${{ steps.tag.outputs.value }}|' .env.new
            chmod 600 .env.new
            mv .env.new .env
          "

          # Удаляем расшифрованный .env с runner'а (defence in depth)
          shred -u /tmp/.env.decrypted 2>/dev/null || rm -f /tmp/.env.decrypted

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/voltari

            echo "Deploying tag ${{ steps.tag.outputs.value }}"
            docker compose pull gateway web

            # 1) Тянем новый gateway-образ, но пока НЕ перезапускаем сервис.
            #    Запускаем миграции в одноразовом контейнере (--rm). Команда
            #    идемпотентна (alembic upgrade head): повторный run = no-op.
            #    Если миграция упадёт — текущий gateway остаётся на старом теге,
            #    rollback не нужен (мы не стартовали новый код).
            echo "Running database migrations (alembic upgrade head)..."
            docker compose run --rm --no-deps \
              -e DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER:-voltari}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-voltari}" \
              gateway alembic upgrade head

            # 2) Только теперь — фактический rolling-restart сервисов.
            docker compose up -d --remove-orphans gateway web
            docker image prune -f

      - name: Health check (liveness — /healthz)
        id: health
        run: |
          echo "Waiting for gateway to come up..."
          sleep 20
          # Liveness: процесс жив, всегда 200. Используем тот же endpoint что
          # Dockerfile HEALTHCHECK и Caddy upstream-checks (DRY).
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://api.brikko.ru/healthz; then
              echo "Liveness OK"
              break
            fi
            echo "Liveness attempt $i failed, retrying in 10s..."
            sleep 10
            if [ "$i" = "5" ]; then
              echo "::error::Liveness check failed after 5 attempts"
              exit 1
            fi
          done

      - name: Readiness check (DB + Redis — /readyz)
        id: ready
        run: |
          # Readiness: 200 → DB+Redis доступны. 503 → деплой ушёл, но gateway
          # не может обслужить трафик. Это блокирующий сигнал, идём в rollback.
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.brikko.ru/readyz || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Readiness OK"
              exit 0
            fi
            echo "Readiness attempt $i: HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          echo "::error::Readiness check failed — DB/Redis unreachable from gateway"
          exit 1

      - name: Rollback on failure
        if: failure() && (steps.health.conclusion == 'failure' || steps.ready.conclusion == 'failure')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/voltari
            if [ -f .env.previous-tag ]; then
              PREV=$(grep -E '^IMAGE_TAG=' .env.previous-tag | cut -d= -f2)
              echo "Rolling back to $PREV"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV|" .env
              docker compose pull gateway web
              docker compose up -d gateway web
            else
              echo "No previous tag found, manual intervention required"
              exit 1
            fi

      # Defence in depth: даже если предыдущие шаги упали — стираем age key с runner'а.
      # GH Actions runners эфемерны, но для соло-репозитория один шаг наказания не лишний.
      - name: Cleanup secrets on runner
        if: always()
        run: |
          shred -u ~/.config/sops/age/keys.txt 2>/dev/null || rm -f ~/.config/sops/age/keys.txt
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          shred -u /tmp/.env.decrypted 2>/dev/null || rm -f /tmp/.env.decrypted
          echo "Runner secrets wiped."

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            *Deploy ${{ steps.tag.outputs.value }}* → `${{ job.status }}`
            commit: `${{ github.sha }}`
            actor: @${{ github.actor }}
