name: Migrations Check

# Проверка корректности alembic-миграций ДО merge в main.
# Триггер: PR с изменениями в apps/gateway/alembic/versions/**.
#
# Что проверяется:
#   1. upgrade head (от scratch) — все миграции применяются на чистую БД
#   2. downgrade -1 — последняя миграция корректно откатывается
#   3. upgrade head повторно — после downgrade upgrade снова работает
#   4. (бонус) проверка отсутствия multiple heads (branching alembic-deri)
#
# Защищает от классов багов:
#   - migration сломана на чистом install (например, ALTER TABLE на ещё
#     несозданной колонке потому что REVISES указан криво)
#   - downgrade забыли описать → невозможно откатить production
#   - Two parallel migrations на одной ревизии → multiple heads после merge
#
# Тайминг: ~2-3 мин (postgres pull 30s + install 60s + 3 миграции 30s).

on:
  pull_request:
    paths:
      - 'apps/gateway/alembic/versions/**'
      - 'apps/gateway/alembic/env.py'
      - 'apps/gateway/alembic.ini'
      - '.github/workflows/migrations-check.yml'

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: alembic upgrade/downgrade roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/gateway

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5432/gateway_migrations
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-not-for-prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/gateway/pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Шаг 1 — multiple heads check. alembic heads должен вернуть РОВНО одну
      # ревизию. Если две — кто-то смержил параллельные ветки миграций
      # без alembic merge, и alembic upgrade head выберет одну из них (другая
      # повиснет detached).
      - name: Check single head
        run: |
          set -euo pipefail
          HEADS=$(alembic heads | grep -v "^$" | wc -l)
          echo "Heads count: $HEADS"
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Multiple alembic heads detected ($HEADS). Run 'alembic merge heads -m \"merge\"' to resolve."
            alembic heads
            exit 1
          fi

      # Шаг 2 — upgrade head на чистую БД. Это то, что произойдёт на
      # fresh install (новый dev-environment, новый staging).
      - name: alembic upgrade head (from scratch)
        run: alembic upgrade head

      # Шаг 3 — downgrade -1 (откат последней миграции).
      # На любом PR который добавляет миграцию это проверит что в новой
      # миграции корректно описан downgrade(). Распространённый баг —
      # пустой downgrade() / pass / NotImplementedError.
      - name: alembic downgrade -1 (rollback last)
        run: alembic downgrade -1

      # Шаг 4 — повторный upgrade head. Должен сработать (миграция
      # идемпотентна по effective state). Ловит баг типа: downgrade
      # частично оставил artifacts (индекс, FK), и upgrade падает с
      # "already exists".
      - name: alembic upgrade head (second time)
        run: alembic upgrade head

      # Шаг 5 — проверка current revision == head (ничего не зависло).
      - name: Verify current = head
        run: |
          set -euo pipefail
          CURRENT=$(alembic current 2>/dev/null | grep -oE '^[a-f0-9_]+' | head -1)
          HEAD=$(alembic heads | grep -oE '^[a-f0-9_]+' | head -1)
          echo "Current: $CURRENT"
          echo "Head:    $HEAD"
          if [ "$CURRENT" != "$HEAD" ]; then
            echo "::error::Current revision ($CURRENT) != head ($HEAD)"
            exit 1
          fi

      # Опциональный шаг — alembic check сравнивает SQLAlchemy models с
      # текущей БД. Если models изменились но миграция не сгенерирована —
      # это здесь поймается. continue-on-error потому что часть моделей
      # может быть не в scope alembic env.py (мы используем target_metadata
      # только для core models).
      - name: alembic check (model drift)
        continue-on-error: true
        run: |
          alembic check 2>&1 || echo "::warning::alembic check found drift — verify if intentional"
