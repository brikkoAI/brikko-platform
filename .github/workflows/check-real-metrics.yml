name: Check Real Metrics (signups + payments)

# On-demand проверка реальных метрик в БД продакшна:
#   - accounts: всего, за 24h, за 7d
#   - subscriptions: tier breakdown
#   - transactions: всего сумма за 7d
#   - api_keys: активные, использованные за 24h
#   - card-links: сколько привязали карту

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Query prod DB
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_brikko
          chmod 600 ~/.ssh/id_brikko
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query prod DB for real metrics
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_brikko -o BatchMode=yes -o ConnectTimeout=15 \
              "${SSH_USER}@${SSH_HOST}" bash -s <<'EOSSH'
          set -euo pipefail
          cd /opt/brikko

          # Load .env to get POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
          set -a
          source .env
          set +a

          PSQL_CMD="docker exec -e PGPASSWORD=$POSTGRES_PASSWORD brikko-postgres psql -U $POSTGRES_USER -d $POSTGRES_DB -t -A"

          echo "=========================================="
          echo "= ACCOUNTS                               ="
          echo "=========================================="
          echo "Total accounts:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM accounts;"
          echo "Created last 24h:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM accounts WHERE created_at > NOW() - INTERVAL '24 hours';"
          echo "Created last 7d:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM accounts WHERE created_at > NOW() - INTERVAL '7 days';"
          echo "By tier:"
          $PSQL_CMD -c "SELECT subscription_tier, COUNT(*) FROM accounts GROUP BY subscription_tier ORDER BY COUNT(*) DESC;"
          echo "With linked card:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM accounts WHERE autorefill_pm_id IS NOT NULL;"
          echo "With active subscription:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM accounts WHERE subscription_active_until > NOW();"

          echo ""
          echo "=========================================="
          echo "= TRANSACTIONS                           ="
          echo "=========================================="
          echo "Total transactions:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM transactions;"
          echo "By kind, last 7 days:"
          $PSQL_CMD -c "SELECT kind, COUNT(*), SUM(amount_kopecks)::bigint/100 as rub FROM transactions WHERE created_at > NOW() - INTERVAL '7 days' GROUP BY kind ORDER BY COUNT(*) DESC;"
          echo "Last 10 transactions:"
          $PSQL_CMD -c "SELECT created_at::date, kind, amount_kopecks/100 as rub, ref_id FROM transactions ORDER BY created_at DESC LIMIT 10;"

          echo ""
          echo "=========================================="
          echo "= API KEYS                               ="
          echo "=========================================="
          echo "Total keys:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM api_keys;"
          echo "Used in last 24h:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM api_keys WHERE last_used_at > NOW() - INTERVAL '24 hours';"

          echo ""
          echo "=========================================="
          echo "= USAGE EVENTS (last 7 days)             ="
          echo "=========================================="
          echo "Total events:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM usage_events WHERE created_at > NOW() - INTERVAL '7 days';"
          echo "By route:"
          $PSQL_CMD -c "SELECT route, COUNT(*) FROM usage_events WHERE created_at > NOW() - INTERVAL '7 days' GROUP BY route ORDER BY COUNT(*) DESC LIMIT 10;" 2>&1 || echo "(no 'route' column — schema may differ)"

          echo ""
          echo "=========================================="
          echo "= WELCOME CREDITS LOG                    ="
          echo "=========================================="
          echo "Total welcome bonuses granted:"
          $PSQL_CMD -c "SELECT COUNT(*) FROM welcome_credits_log;" 2>&1 || echo "(table missing)"

          echo ""
          echo "=========================================="
          echo "= WEBHOOK EVENTS (last 7d)               ="
          echo "=========================================="
          $PSQL_CMD -c "SELECT status, COUNT(*) FROM processed_webhooks WHERE created_at > NOW() - INTERVAL '7 days' GROUP BY status ORDER BY COUNT(*) DESC;" 2>&1 || echo "(table missing)"
          EOSSH
